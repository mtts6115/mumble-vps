# ==============================================================================
# Murmur / Mumble Server Configuration File
# ==============================================================================
# For detailed configuration documentation, visit:
# https://wiki.mumble.info/wiki/Murmur.ini

# Path to database file
database=/data/mumble-server.sqlite

# Server IP binding (leave empty to bind to all available IPv4 and IPv6 interfaces)
host=

# Default Mumble port (Default: 64738)
port=64738

# Server password (leave blank for public access)
serverpassword=

# Maximum allowed concurrent users
users=100

# Maximum audio bandwidth in bits per second (bps)
# 72000 = High quality
# 96000 = Studio quality
# 128000 = Maximum quality
bandwidth=96000

# Welcome message displayed upon connection (HTML allowed)
welcometext="<br />Welcome to our <b>Mumble Server</b>.<br />Enjoy low latency and crystal clear voice!<br />"

# Root channel registration name
registerName=My Mumble Community Server

# Message size limits
textmessagelength=5000
imagemessagelength=131072

# Enable HTML in messages and channel descriptions
allowhtml=true

# Opus codec threshold percentage (100 = 100% allowed)
opusthreshold=100

# Channel and username validation regex
channelname=[ \\-=\\w\\#\\[\\]\\{\\}\\(\\)\\@\\|]+
username=[-=\\w\\[\\]\\{\\}\\(\\)\\@\\|\\.]+

# Security & Permissions
# Disallow users from registering themselves if set to false
# allowping=true

# SSL / TLS Settings (Optional: specify custom certificates if not using self-signed)
# sslCert=/certs/fullchain.pem
# sslKey=/certs/privkey.pem
